    <style>
      /* Loading shell — shown until the React app boots, so the tab never looks blank */
      #pp-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0A0A0A;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;z-index:9999}
      #pp-boot .pp-boot-mark{font-weight:800;font-size:22px;letter-spacing:-.02em}
      #pp-boot .pp-boot-mark span{color:#9B2B2B}
      #pp-boot .pp-boot-spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.15);border-top-color:#9B2B2B;border-radius:50%;animation:pp-boot-spin .8s linear infinite}
      @keyframes pp-boot-spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="pp-boot" aria-hidden="true">
      <div class="pp-boot-mark">Pole<span>Position</span></div>
      <div class="pp-boot-spin"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
