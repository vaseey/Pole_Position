name: Build & Deploy to Supabase Storage

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.js"
      - "index.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: "Upload dist to Supabase Storage (bucket: Site)"
        env:
          SUPABASE_URL: "https://tozzhpyvromigzhtzlvc.supabase.co"
          SUPABASE_SERVICE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
        run: |
          find dist -type f | while read file; do
            REMOTE_PATH="${file#dist/}"
            MIME=$(file -b --mime-type "$file")
            BODY=$(curl -s -w "\n%{http_code}" -X POST \
              "$SUPABASE_URL/storage/v1/object/Site/$REMOTE_PATH" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: $MIME" \
              -H "x-upsert: true" \
              --data-binary @"$file")
            HTTP=$(echo "$BODY" | tail -1)
            echo "$HTTP  $REMOTE_PATH  $(echo "$BODY" | head -1)"
          done
